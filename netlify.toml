[build]
  base = "frontend"
  command = "npm run build && cd ../backend && npm install --omit=dev && cd ../netlify/functions && npm install"
  publish = "dist"
  functions = "../netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
